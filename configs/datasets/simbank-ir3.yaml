# SimBank — set_ir_3_levels intervention (T2.2): action width w=3.
# The bank chooses one of three interest rates (0.07/0.08/0.09) when the process
# reaches calculate_offer (action depth 1, process-triggered decision point).
# Offline log: 100k train + 10k val cases at confounding delta=0.5 (half bank
# policy, half RCT) so all three rates have support; generated by
# SimBank/scripts/generate_ir3_log.py, relabeled by scripts/27_prepare_simbank_ir3.py.
# KPI: terminal case profit (same 'outcome' column as the w=2 SimBank setting).

dataset_name: "simbank-ir3"

data:
  format: pickle
  raw_path: "data/raw/loan_log_ir3_delta05"
  output_clean_path: "data/{dataset_name}/interim/clean.parquet"

schema:
  case_id: "case_nr"
  activity: "activity"
  timestamp: "timestamp"

preprocess:
  out_clean_parquet: "clean.parquet"
  lifecycle_filter:
    enabled: false
  select_cols: ["case_id", "activity", "timestamp", "outcome"]

outcome_engineering:
  enabled: false  # 'outcome' (terminal profit) comes with the simulator log

validation_split:
  range_checks:
    enabled: false

training:
  max_steps: 100000
  eval_every: 5000
  save_every: 20000

mdp:
  behavior_trigger_activity: "calculate_offer_ir9"  # unused with by_next_event_action
  decision_points:
    mode: "all"
  actions:
    id2name: ["do_nothing", "calculate_offer_ir7", "calculate_offer_ir8", "calculate_offer_ir9"]
    noop_action: "do_nothing"
  action_mask:
    mode: "by_next_event_action"
  reward:
    type: "terminal_profit_delayed"
    intermediate_reward: 0.0
    terminal_column: "outcome"
  output:
    path: "data/{dataset_name}/processed/D_offline.npz"

xai:
  checkpoint_path: "artifacts/models/tdqn/20260807_211812/Q_theta.ckpt"  # v2 (fase2 auto)
  out_dir: "xai/{dataset_name}"
  n_cases: 500
  selection:
    strategy: "random"
    k_times_per_case: "all"
  methods:
    intervention:
      contrast:
        baseline_action: "runner_up"
        action_id: -1   # sentinel: per-state runner-up (overrides base action_id 0)

experiment:
  checkpoint_path: "artifacts/models/tdqn/20260807_211812/Q_theta.ckpt"  # v2 (fase2 auto)
  ope_report_path: "artifacts/ope/{dataset_name}/ope_dr.json"

fidelity:
  out_csv: "artifacts/fidelity/{dataset_name}/fidelity.csv"
