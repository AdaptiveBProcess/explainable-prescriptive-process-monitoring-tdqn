# BPI Challenge 2012 — robustness configuration (aptitud-datasets-2026-08-07.md)
# Same raw log as bpi2012; the ONLY change is the declared intervention:
# W_Nabellen offertes (calling applicant about an offer) instead of
# W_Nabellen incomplete dossiers. Fires in 38.3% of cases (vs 12.6%),
# first occurrence earlier (rel. pos 0.41 vs 0.58), ~10 repetitions/case,
# n_test ≈ 1,003 margin cases (3x the primary configuration).
# Question it answers: do the paper's conclusions depend on WHICH activity
# is declared as the intervention?

dataset_name: "bpi2012-offertes"

data:
  format: csv
  raw_path: "data/raw/bpi2012.csv"
  output_clean_path: "data/{dataset_name}/interim/clean.parquet"

schema:
  case_id: "case_id"
  activity: "activity"
  timestamp: "timestamp"

time:
  timezone: null
  output_timezone: "UTC"
  sort: true
  drop_duplicates: false

preprocess:
  out_clean_parquet: "clean.parquet"
  lifecycle_filter:
    enabled: true
    column: "lifecycle"
    keep: ["complete", "COMPLETE"]
  select_cols: ["case_id", "activity", "timestamp"]

outcome_engineering:
  enabled: true
  type: "activity_presence"
  positive_activities: ["A_APPROVED"]
  outcome_col: "outcome"

validation_split:
  range_checks:
    enabled: false

# Same transition count as bpi2012 (~115k total, ~80k train).
training:
  max_steps: 60000
  eval_every: 5000
  save_every: 20000

mdp:
  behavior_trigger_activity: "W_Nabellen offertes"
  decision_points:
    mode: "all"
  actions:
    id2name: ["do_nothing", "W_Nabellen offertes"]
    noop_action: "do_nothing"
  action_mask:
    default_valid: ["do_nothing", "W_Nabellen offertes"]
  reward:
    type: "terminal_profit_delayed"
    intermediate_reward: 0.0
    terminal_column: "outcome"
  output:
    path: "data/{dataset_name}/processed/D_offline.npz"

experiment:
  checkpoint_path: "artifacts/models/tdqn/20260808_141855/Q_theta.ckpt"  # v2 (fase2 auto)
  ope_report_path: "artifacts/ope/{dataset_name}/ope_dr.json"

xai:
  checkpoint_path: "artifacts/models/tdqn/20260808_141855/Q_theta.ckpt"  # v2 (fase2 auto)
  out_dir: "xai/{dataset_name}"

fidelity:
  out_csv: "artifacts/fidelity/{dataset_name}/fidelity.csv"

distill:
  teacher_checkpoint: "artifacts/models/tdqn/20260808_141855/Q_theta.ckpt"  # v2 (fase2 auto)
  out_dir: "artifacts/distill/{dataset_name}"
