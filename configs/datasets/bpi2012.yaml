# BPI Challenge 2012 — Loan Application Process (predecessor of BPI 2017)
# 13,087 cases, 262,200 raw events (164,506 after COMPLETE lifecycle filter)
# Intervention: W_Nabellen incomplete dossiers (calling applicant about an
#   incomplete dossier) — executed in only 12.6% of cases (32.2% of the
#   A_ACCEPTED subpopulation), i.e. genuinely NON-universal, unlike
#   W_Call after offers in BPI 2017 (>99%).
# Positive outcome: A_APPROVED (17.2% of cases; 43.9% among accepted) — not saturated.

dataset_name: "bpi2012"

data:
  format: csv
  raw_path: "data/raw/bpi2012.csv"
  output_clean_path: "data/{dataset_name}/interim/clean.parquet"

schema:
  case_id: "case_id"
  activity: "activity"
  timestamp: "timestamp"

time:
  timezone: null
  output_timezone: "UTC"
  sort: true
  drop_duplicates: false

preprocess:
  out_clean_parquet: "clean.parquet"
  lifecycle_filter:
    enabled: true
    column: "lifecycle"
    keep: ["complete", "COMPLETE"]
  select_cols: ["case_id", "activity", "timestamp"]

outcome_engineering:
  enabled: true
  type: "activity_presence"
  positive_activities: ["A_APPROVED"]
  outcome_col: "outcome"

validation_split:
  range_checks:
    enabled: false

# ~115k COMPLETE-event transitions total, ~80k train. 60k steps ≈ 96 epochs at 128.
training:
  max_steps: 60000
  eval_every: 5000
  save_every: 20000

mdp:
  behavior_trigger_activity: "W_Nabellen incomplete dossiers"
  decision_points:
    mode: "all"
  actions:
    id2name: ["do_nothing", "W_Nabellen incomplete dossiers"]
    noop_action: "do_nothing"
  action_mask:
    default_valid: ["do_nothing", "W_Nabellen incomplete dossiers"]
  reward:
    type: "terminal_profit_delayed"
    intermediate_reward: 0.0
    terminal_column: "outcome"
  output:
    path: "data/{dataset_name}/processed/D_offline.npz"

experiment:
  checkpoint_path: "artifacts/models/tdqn/20260808_081349/Q_theta.ckpt"  # v2 (fase2 auto)
  ope_report_path: "artifacts/ope/{dataset_name}/ope_dr.json"

xai:
  checkpoint_path: "artifacts/models/tdqn/20260808_081349/Q_theta.ckpt"  # v2 (fase2 auto)
  out_dir: "xai/{dataset_name}"

fidelity:
  out_csv: "artifacts/fidelity/{dataset_name}/fidelity.csv"

distill:
  teacher_checkpoint: "artifacts/models/tdqn/20260808_081349/Q_theta.ckpt"  # v2 (fase2 auto)
  out_dir: "artifacts/distill/{dataset_name}"
